---
ci:
  # format compatible with commitlint
  autoupdate_commit_msg: "chore: pre-commit autoupdate"
  autoupdate_schedule: monthly
  autofix_commit_msg: "chore: auto fixes from pre-commit.com hooks"

# As in vyos.vyos and rest.vyos, without collection_prep (this collection has
# no plugins to document) and the Python formatters (no Python content apart
# from the test-only connection plugin).
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-symlinks
      - id: end-of-file-fixer
      - id: no-commit-to-branch
        args: [--branch, main]
      - id: trailing-whitespace

  # pre-commit/mirrors-prettier is archived; rbubley/mirrors-prettier is the maintained mirror
  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.9.9
    hooks:
      - id: prettier
        # YAML is formatted and checked by ansible-lint (yamllint); prettier wraps long
        # flow mappings in a way yamllint rejects, so it only handles Markdown and JSON.
        types_or: [markdown, json]
