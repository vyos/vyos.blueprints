---
name: Check label
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
on: # yamllint disable-line rule:truthy
  pull_request_target:
    types: [opened, labeled, unlabeled, synchronize]
jobs:
  check_label:
    # The reusable workflow requests these; the repository default token is
    # read-only, so they have to be granted here explicitly.
    permissions:
      checks: write
      contents: write
      pull-requests: write
    uses: ansible/ansible-content-actions/.github/workflows/check_label.yaml@cbdec1f72eeee38b7e60d0f2346c66e622eea02a # main
