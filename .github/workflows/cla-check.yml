name: "CLA Check"
permissions:
  actions: write
  contents: read
  pull-requests: write
  statuses: write
on:
  pull_request_target:
    types: [opened, synchronize, closed]
  issue_comment:
    types: [created]
jobs:
  call-cla-assistant:
    uses: vyos/vyos-cla-signatures/.github/workflows/cla-reusable.yml@production
    secrets:
      # only the vyos-bot key the shared CLA workflow declares
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
