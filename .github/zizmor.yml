# zizmor configuration (https://docs.zizmor.sh/configuration/)
rules:
  unpinned-uses:
    config:
      policies:
        # reusable workflows maintained by the VyOS organisation itself
        "vyos/*": ref-pin
        # everything else by commit SHA (Dependabot keeps the pins current)
        "*": hash-pin
  dangerous-triggers:
    ignore:
      # pull_request_target is needed to comment on pull requests from forks; the
      # CLA workflow does not check out or run code from the pull request.
      - cla-check.yml
