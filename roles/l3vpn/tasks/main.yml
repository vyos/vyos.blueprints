---
- name: Configure the L3VPN control plane (skipped when l3vpn_asn is not set)
  when: l3vpn_asn is not none and l3vpn_asn | string | length > 0
  block:
    - name: Configure the BGP process
      vyos.vyos.vyos_bgp_global:
        config: "{{ lookup('ansible.builtin.template', 'bgp_global.yml.j2') | from_yaml }}"
        state: "{{ _l3vpn_state }}"
      register: _l3vpn_r_bgp

    - name: Configure the peer-group and VPNv4 neighbours
      # Not expressible with the BGP modules yet.
      vyos.vyos.vyos_config:
        lines: "{{ _l3vpn_lines }}"
      register: _l3vpn_r_cli
      when:
        - _l3vpn_lines | length > 0
        - not (vyos_blueprints_render_only | default(false) | bool)

    - name: Collect rendered commands # noqa: var-naming[no-role-prefix] - shared across roles by design
      ansible.builtin.set_fact:
        vyos_blueprints_rendered: "{{ vyos_blueprints_rendered | default([]) + (_l3vpn_r_bgp.rendered | default([])) + _l3vpn_lines }}"
      when: vyos_blueprints_render_only | default(false) | bool
