---
- name: Read VPNv4 sessions
  vyos.vyos.vyos_command:
    commands: [show bgp ipv4 vpn summary]
  register: _l3vpn_v
  when: l3vpn_neighbors | length > 0

- name: Every VPNv4 session is established
  ansible.builtin.assert:
    that: >-
      _l3vpn_v.stdout[0] is search('(?m)^' ~ (item.address | regex_escape)
      ~ ' .* ([0-9]{2}:[0-9]{2}:[0-9]{2}|[0-9]+[dwh][0-9a-z]*) +[0-9]+( |$)')
    fail_msg: "VPNv4 session to {{ item.address }} is not established"
    quiet: true
  loop: "{{ l3vpn_neighbors }}"
  loop_control:
    label: "{{ item.address }}"
