---
argument_specs:
  main:
    short_description: Routing policy - access-lists, prefix-lists and route-maps
    description:
      - Building block for route filtering used by the OSPF and BGP blueprints.
      - Prefix-lists and route-maps use vyos.vyos.vyos_prefix_lists and
        vyos_route_maps; access-lists and route-map descriptions use
        vyos.vyos.vyos_config, because vyos.vyos has no access-list module and
        vyos_route_maps no route-map description yet.
      - Run before the routing roles that reference these policies.
    options:
      route_policy_access_lists:
        type: list
        elements: dict
        default: []
        description: Numbered IPv4 access-lists (C(policy access-list)).
        options:
          number: {type: int, required: true, description: "Access-list number, e.g. C(150)."}
          description: {type: str, description: Description.}
          rules:
            type: list
            elements: dict
            required: true
            description: Rules.
            options:
              number: {type: int, required: true, description: Rule number.}
              action: {type: str, choices: [permit, deny], required: true, description: Rule action.}
              source:
                type: dict
                description: "C({any: true}) or C({network: 10.0.0.0, inverse_mask: 0.0.0.255}) or C({host: 192.0.2.1})."
              destination:
                type: dict
                description: Same form as C(source).
      route_policy_prefix_lists:
        type: list
        elements: dict
        default: []
        description: Prefix-lists (C(prefix-list), or C(prefix-list6) with C(afi=ipv6)).
        options:
          name: {type: str, required: true, description: Prefix-list name.}
          afi: {type: str, choices: [ipv4, ipv6], default: ipv4, description: Address family.}
          description: {type: str, description: Description.}
          rules:
            type: list
            elements: dict
            required: true
            description: Rules.
            options:
              sequence: {type: int, required: true, description: Rule number.}
              action: {type: str, choices: [permit, deny], required: true, description: Rule action.}
              prefix: {type: str, required: true, description: Prefix to match.}
              ge: {type: int, description: Minimum prefix length.}
              le: {type: int, description: Maximum prefix length.}
              description: {type: str, description: Rule description.}
      route_policy_route_maps:
        type: list
        elements: dict
        default: []
        description: Route-maps.
        options:
          name: {type: str, required: true, description: Route-map name.}
          description: {type: str, description: Description.}
          rules:
            type: list
            elements: dict
            required: true
            description: Rules.
            options:
              sequence: {type: int, required: true, description: Rule number.}
              action: {type: str, choices: [permit, deny], required: true, description: Rule action.}
              description: {type: str, description: Rule description.}
              match_prefix_list: {type: str, description: Match this prefix-list.}
              match_access_list: {type: str, description: Match this access-list (number).}
              match_prefix_list6: {type: str, description: Match this IPv6 prefix-list.}
              set_as_path_prepend: {type: str, description: "AS-path prepend, e.g. C(65551 65551 65551)."}
      vyos_blueprints_render_only:
        type: bool
        default: false
        description: Collect commands into C(vyos_blueprints_rendered) instead of configuring.
