---
argument_specs:
  main:
    short_description: QoS shaper policies and DSCP marking (docs blueprint "QoS example")
    description:
      - Creates shaper policies with classes (bandwidth, ceiling, burst,
        priority, queue type, DSCP re-marking), a default class, and attaches
        policies to interfaces.
      - "Class matches are written as nested dictionaries that map one-to-one to the CLI below C(match <name>),
        e.g. C({ip: {source: {address: 172.17.1.2/32}}}) or C({ether: {protocol: all}}); underscores become dashes.
        Every match option VyOS offers can be expressed."
      - Configured with vyos.vyos.vyos_config, because vyos.vyos has no QoS module.
    options:
      qos_shapers:
        type: list
        elements: dict
        default: []
        description: Shaper policies.
        options:
          name: { type: str, required: true, description: Policy name. }
          bandwidth:
            { type: str, description: "Available bandwidth, e.g. C(100mbit)." }
          description: { type: str, description: Policy description. }
          default:
            type: dict
            description: Default class (bandwidth, ceiling, burst, priority, queue_type).
          classes:
            type: list
            elements: dict
            default: []
            description: Classes.
            options:
              id: { type: int, required: true, description: Class number. }
              description: { type: str, description: Class description. }
              bandwidth:
                {
                  type: str,
                  description: "Guaranteed bandwidth, e.g. C(5mbit) or C(100%).",
                }
              ceiling: { type: str, description: Maximum bandwidth. }
              burst: { type: str, description: "Burst size, e.g. C(15k)." }
              priority:
                { type: int, description: Priority (lower is served first). }
              queue_type:
                { type: str, description: "Queue type, e.g. C(fair-queue)." }
              set_dscp:
                { type: str, description: "DSCP value to set, e.g. C(CS4)." }
              matches:
                type: list
                elements: dict
                default: []
                description: "Matches, each C({name: <match>, <criteria as nested dicts>})."
      qos_interfaces:
        type: list
        elements: dict
        default: []
        description: Policy attachment.
        options:
          name: { type: str, required: true, description: Interface. }
          egress: { type: str, description: Policy for outgoing traffic. }
          ingress: { type: str, description: Policy for incoming traffic. }
      vyos_blueprints_render_only:
        type: bool
        default: false
        description: Collect commands into C(vyos_blueprints_rendered) instead of configuring.
  verify:
    short_description: Post-deployment checks for the qos role
    description: Run with C(tasks_from=verify). Checks every attached policy is active on its interface.
    options:
      qos_interfaces:
        {
          type: list,
          elements: dict,
          default: [],
          description: Same value as for C(main).,
        }
