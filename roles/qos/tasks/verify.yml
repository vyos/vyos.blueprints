---
- name: Read QoS state
  vyos.vyos.vyos_command:
    commands: [show qos shaper]
  register: _qos_v
  when: qos_interfaces | length > 0

- name: Every attached policy is active on its interface
  ansible.builtin.assert:
    that: _qos_v.stdout[0] is search('(?<![A-Za-z0-9_])' ~ (item.name | regex_escape) ~ '(?![A-Za-z0-9_])')
    fail_msg: "no QoS policy active on {{ item.name }}; 'show qos shaper' returned: {{ _qos_v.stdout[0] | default('') | truncate(800) }}"
    quiet: true
  loop: "{{ qos_interfaces }}"
  loop_control:
    label: "{{ item.name }}"
