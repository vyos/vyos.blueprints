---
- name: Configure QoS policies and attach them
  # No vyos.vyos QoS module.
  vyos.vyos.vyos_config:
    lines: "{{ _qos_lines }}"
  register: _qos_r_cli
  when:
    - _qos_lines | length > 0
    - not (vyos_blueprints_render_only | default(false) | bool)

- name: Collect rendered commands  # noqa: var-naming[no-role-prefix] - shared across roles by design
  ansible.builtin.set_fact:
    vyos_blueprints_rendered: "{{ vyos_blueprints_rendered | default([]) + _qos_lines }}"
  when: vyos_blueprints_render_only | default(false) | bool
