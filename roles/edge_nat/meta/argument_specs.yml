---
argument_specs:
  main:
    short_description: Internet edge with source NAT
    description:
      - Addresses the WAN interface (DHCP or static), adds a default route
        for static WANs and masquerades outbound traffic.
      - Pair with C(vyos.blueprints.base) for LAN addressing and with a
        firewall role before exposing the router to the internet.
    options:
      edge_nat_wan_interface:
        type: str
        required: true
        description: WAN interface, e.g. C(eth1).
      edge_nat_wan_address:
        type: str
        default: dhcp
        description: C(dhcp) or a static IPv4 address in CIDR notation.
      edge_nat_wan_gateway:
        type: str
        default: ""
        description: Upstream gateway. Required when the WAN address is static.
      edge_nat_source_networks:
        type: list
        elements: str
        default: []
        description:
          - Inside networks to masquerade, one NAT rule each.
          - When empty, a single rule masquerades everything leaving the WAN.
      edge_nat_rule_base:
        type: int
        default: 100
        description: First source NAT rule number; further rules increment by 10.
      vyos_blueprints_render_only:
        type: bool
        default: false
        description: Collect commands into C(vyos_blueprints_rendered) instead of configuring.
  verify:
    short_description: Post-deployment checks for the edge_nat role
    description: Run with C(tasks_from=verify). Uses the same inputs as C(main).
    options:
      edge_nat_wan_interface:
        type: str
        required: true
        description: WAN interface.
