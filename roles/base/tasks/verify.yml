---
- name: Read hostname and interface state
  vyos.vyos.vyos_command:
    commands:
      - show host name
      - show interfaces
  register: _base_v

- name: Hostname matches
  ansible.builtin.assert:
    that: _base_v.stdout[0] | trim == base_hostname
    fail_msg: "hostname is '{{ _base_v.stdout[0] | trim }}', expected '{{ base_hostname }}'"
    quiet: true

- name: Static addresses are present
  ansible.builtin.assert:
    that: item.1 in _base_v.stdout[1]
    fail_msg: "{{ item.1 }} not found on {{ item.0.name }} in 'show interfaces'"
    quiet: true
  loop: "{{ base_interfaces | subelements('addresses', skip_missing=true) }}"
  loop_control:
    label: "{{ item.0.name }} {{ item.1 }}"
  when: item.1 not in ['dhcp', 'dhcpv6']
