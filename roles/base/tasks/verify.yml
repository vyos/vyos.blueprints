---
- name: Read the configured hostname and interface state
  # The configured host-name, not "show host name": in containers the system
  # hostname belongs to the container runtime and VyOS cannot change it.
  vyos.vyos.vyos_command:
    commands:
      - show configuration commands | match "system host-name"
      - show interfaces
  register: _base_v

- name: Hostname matches
  ansible.builtin.assert:
    that: _base_hostname_configured == base_hostname
    fail_msg: "configured host-name is '{{ _base_hostname_configured }}', expected '{{ base_hostname }}'"
    quiet: true
  vars:
    _base_hostname_configured: "{{ (_base_v.stdout[0] | regex_search(\"host-name '?([^'\\s]+)'?\", '\\1') or ['']) | first }}"

- name: Static addresses are present
  ansible.builtin.assert:
    that: item.1 in _base_v.stdout[1]
    fail_msg: "{{ item.1 }} not found on {{ item.0.name }} in 'show interfaces'"
    quiet: true
  loop: "{{ base_interfaces | subelements('addresses', skip_missing=true) }}"
  loop_control:
    label: "{{ item.0.name }} {{ item.1 }}"
  when: item.1 not in ['dhcp', 'dhcpv6']
