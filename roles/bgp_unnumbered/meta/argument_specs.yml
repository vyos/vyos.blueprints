---
argument_specs:
  main:
    short_description: BGP IPv6 unnumbered with extended next-hop (docs blueprint of the same name)
    description:
      - Peers over IPv6 link-local addresses on each listed interface, carries
        IPv4 and IPv6 with extended next-hop, and redistributes connected
        routes. Parallel links give ECMP; C(multipath-relax) allows it across
        different neighbour ASes.
      - Puts the router-id as a /32 on C(lo), as in the page's results.
      - AS, router-id and redistribution use vyos.vyos BGP modules. Peer-group,
        interface (v6only) neighbours and multipath-relax use
        vyos.vyos.vyos_config, because the BGP resource modules cannot express
        them yet.
      - Works for any number of routers; each router lists only its own links.
    options:
      bgp_unnumbered_asn:
        type: int
        required: true
        description: Local AS number (C(system-as)).
      bgp_unnumbered_router_id:
        type: str
        required: true
        description: BGP router-id; also configured as a /32 on C(lo).
      bgp_unnumbered_interfaces:
        type: list
        elements: str
        required: true
        description: Interfaces to peer on, e.g. C([eth1, eth2]). They need no IP address.
      bgp_unnumbered_peer_group:
        type: str
        default: fabric
        description: Peer-group name shared by all unnumbered neighbours.
      bgp_unnumbered_remote_as:
        type: str
        default: external
        description: C(external), C(internal) or an AS number.
      bgp_unnumbered_address_families:
        type: list
        elements: str
        choices: [ipv4, ipv6]
        default: [ipv4, ipv6]
        description: Address families activated on the peer-group.
      bgp_unnumbered_redistribute:
        type: list
        elements: str
        default: [connected]
        description: Route types redistributed in every listed address family.
      bgp_unnumbered_multipath_relax:
        type: bool
        default: true
        description: Set C(bestpath as-path multipath-relax).
      bgp_unnumbered_group:
        type: str
        default: ""
        description: Inventory group of all routers in the fabric; used only by C(verify).
      vyos_blueprints_render_only:
        type: bool
        default: false
        description: Collect commands into C(vyos_blueprints_rendered) instead of configuring.
  verify:
    short_description: Post-deployment checks for the bgp_unnumbered role
    description:
      - Run with C(tasks_from=verify) against all routers in the same play.
      - Checks one established session per listed interface and, with
        C(bgp_unnumbered_group), a BGP route to every other router-id. When the
        group has exactly two routers, also checks one ECMP next hop per link.
    options:
      bgp_unnumbered_router_id:
        type: str
        required: true
        description: Same value as for C(main).
      bgp_unnumbered_interfaces:
        type: list
        elements: str
        required: true
        description: Same value as for C(main).
      bgp_unnumbered_group:
        type: str
        default: ""
        description: Same value as for C(main).
