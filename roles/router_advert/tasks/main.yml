---
- name: Configure router advertisements
  # No vyos.vyos router-advert module.
  vyos.vyos.vyos_config:
    lines: "{{ _router_advert_lines }}"
  register: _router_advert_r_cli
  when:
    - _router_advert_lines | length > 0
    - not (vyos_blueprints_render_only | default(false) | bool)

- name: Collect rendered commands # noqa: var-naming[no-role-prefix] - shared across roles by design
  ansible.builtin.set_fact:
    vyos_blueprints_rendered: "{{ vyos_blueprints_rendered | default([]) + _router_advert_lines }}"
  when: vyos_blueprints_render_only | default(false) | bool
