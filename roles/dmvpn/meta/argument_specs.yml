---
argument_specs:
  main:
    short_description: DMVPN (docs blueprint "DMVPN Dual HUB Dual Cloud")
    description:
      - NHRP on multipoint GRE tunnels for hubs (C(multicast dynamic),
        C(redirect)) and spokes (NHS with NBMA address, C(shortcut)), IPsec
        transport-mode protection through an IPsec profile bound to the
        tunnels, and an output-filter rule dropping GRE that is not protected
        by IPsec, as the docs page recommends.
      - The mGRE tunnel interfaces belong to C(vyos.blueprints.gre_tunnel)
        (address /32, no remote, C(enable_multicast), C(key)); the routing
        protocol over them to C(vyos.blueprints.ospf).
      - NHRP is configured with vyos.vyos.vyos_config, because vyos.vyos has no
        NHRP module; IPsec uses vyos_vpn_ipsec and the GRE rule
        vyos_firewall_rules. The NHRP authentication string and the PSK are masked.
    options:
      dmvpn_nhrp_tunnels:
        type: list
        elements: dict
        default: []
        description: NHRP per tunnel.
        options:
          name: {type: str, required: true, description: "Tunnel interface, e.g. C(tun100)."}
          network_id: {type: int, required: true, description: NHRP network id (one per cloud).}
          authentication: {type: str, no_log: true, description: NHRP authentication string.}
          holdtime: {type: int, description: Hold time in seconds.}
          multicast: {type: str, description: "C(dynamic) on hubs, the hub's NBMA address on spokes."}
          redirect: {type: bool, default: false, description: "Send NHRP redirects (hubs, DMVPN phase 3)."}
          shortcut: {type: bool, default: false, description: "Accept NHRP shortcuts (spokes, DMVPN phase 3)."}
          registration_no_unique: {type: bool, default: false, description: Allow re-registration from a changed NBMA address.}
          nhs:
            type: list
            elements: dict
            default: []
            description: Next-hop servers (spokes).
            options:
              tunnel_ip: {type: str, default: dynamic, description: "Hub tunnel address, or C(dynamic)."}
              nbma: {type: str, required: true, description: Hub's public (NBMA) address.}
      dmvpn_ipsec:
        type: dict
        description: IPsec protection of the tunnels. Omit for unencrypted DMVPN.
        options:
          interfaces: {type: list, elements: str, default: [], description: "Interfaces IPsec listens on, e.g. C([eth0])."}
          ike_group: {type: dict, required: true, description: "IKE group - name, key_exchange, lifetime, proposal_id, dh_group, encryption, hash."}
          esp_group: {type: dict, required: true, description: "ESP group - name, lifetime, mode (transport), pfs, proposal_id, encryption, hash."}
          profile:
            type: dict
            required: true
            description: IPsec profile bound to the tunnels.
            options:
              name: {type: str, required: true, description: "Profile name, e.g. C(NHRPVPN)."}
              psk: {type: str, required: true, no_log: true, description: Pre-shared secret.}
              bind_tunnels: {type: list, elements: str, required: true, description: Tunnels the profile protects.}
      dmvpn_drop_unprotected_gre:
        type: dict
        description: "Drop GRE not protected by an outbound IPsec policy, e.g. C({rule: 10}). Put it before any rule permitting GRE."
        options:
          rule: {type: int, default: 10, description: Output-filter rule number.}
      vyos_blueprints_render_only:
        type: bool
        default: false
        description: Collect commands into C(vyos_blueprints_rendered) instead of configuring.
  verify:
    short_description: Post-deployment checks for the dmvpn role
    description:
      - Run with C(tasks_from=verify). On spokes, checks the NHRP registration
        to every NHS; with IPsec, checks an SA is up for every protected tunnel.
    options:
      dmvpn_nhrp_tunnels: {type: list, elements: dict, default: [], description: Same value as for C(main).}
      dmvpn_ipsec: {type: dict, description: Same value as for C(main).}
