---
_ipsec_route_based_state: "{{ 'rendered' if (vyos_blueprints_render_only | default(false) | bool) else 'merged' }}"
_ipsec_route_based_ospf: "{{ ipsec_route_based_ospf | default({}, true) }}"
_ipsec_route_based_bgp: "{{ ipsec_route_based_bgp | default({}, true) }}"
_ipsec_route_based_cli_lines: "{{ (lookup('ansible.builtin.template', 'vti_cli.j2') or '').splitlines() | select | list }}"
# One PSK entry per psk_name; peers sharing a psk_name contribute all their ids.
_ipsec_route_based_psks: >-
  {%- set out = [] -%}
  {%- set names = [] -%}
  {%- for p in ipsec_route_based_peers -%}
  {%-   set n = p.psk_name | default(p.name ~ '-PSK') -%}
  {%-   set ids = [p.local_id | default(p.local_address), p.remote_id | default(p.remote_address)] -%}
  {%-   if n in names -%}
  {%-     set e = out[names.index(n)] -%}
  {%-     for i in ids if i not in e.id -%}{%- set _ = e.id.append(i) -%}{%- endfor -%}
  {%-   else -%}
  {%-     set e = {'name': n, 'id': ids | unique | list, 'secret': p.psk} -%}
  {%-     if p.psk_type is defined -%}{%- set _ = e.update({'secret_type': p.psk_type}) -%}{%- endif -%}
  {%-     set _ = names.append(n) -%}
  {%-     set _ = out.append(e) -%}
  {%-   endif -%}
  {%- endfor -%}
  {{ out }}
_ipsec_route_based_policy: "{{ ipsec_route_based_policy | default({}, true) }}"
_ipsec_route_based_ike_cli_lines: "{{ (lookup('ansible.builtin.template', 'ike_cli.j2') or '').splitlines() | select | list }}"

# VyOS 1.5 runs FRR with "no bgp default ipv4-unicast": a neighbour is only active in an
# address family configured for it. Neighbours with AF options get one through
# vyos_bgp_address_family; the others need the bare node (finding B13).
_ipsec_route_based_af_activation_lines: >-
  {%- set out = [] -%}
  {%- for n in (_ipsec_route_based_bgp.neighbors | default([])) | selectattr('address', 'defined')
      if not ((n.soft_reconfiguration_inbound | default(false) | bool)
              or n.route_map_import is defined or n.route_map_export is defined) -%}
  {%-   set _ = out.append('set protocols bgp neighbor ' ~ n.address ~ ' address-family '
                           ~ ('ipv6' if ':' in n.address else 'ipv4') ~ '-unicast') -%}
  {%- endfor -%}
  {{ out if _ipsec_route_based_bgp | length > 0 else [] }}
