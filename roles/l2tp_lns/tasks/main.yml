---
- name: Configure the L2TP network server
  # No vyos.vyos L2TP module.
  vyos.vyos.vyos_config:
    lines: "{{ _l2tp_lns_lines }}"
  register: _l2tp_lns_r_cli
  no_log: true
  when:
    - _l2tp_lns_lines | length > 0
    - not (vyos_blueprints_render_only | default(false) | bool)

- name: Collect rendered commands with secrets masked  # noqa: var-naming[no-role-prefix] - shared across roles by design
  ansible.builtin.set_fact:
    vyos_blueprints_rendered: "{{ vyos_blueprints_rendered | default([]) + _l2tp_lns_masked }}"
  vars:
    _l2tp_lns_masked: >-
      {%- set out = [] -%}
      {%- for line in _l2tp_lns_lines -%}
      {%-   set ns = namespace(l=line) -%}
      {%-   for p in _l2tp_lns_mask_patterns -%}
      {%-     set ns.l = ns.l | regex_replace(p, "\\1 '********'") -%}
      {%-   endfor -%}
      {%-   set _ = out.append(ns.l) -%}
      {%- endfor -%}
      {{ out }}
  when: vyos_blueprints_render_only | default(false) | bool
