---
# An upgrade is an operation, not configuration: a render-only run has nothing to render
# and must never touch the device. Including the work (instead of "meta: end_host")
# lets the rest of the play continue.
- name: Upgrade the router
  ansible.builtin.include_tasks: upgrade.yml
  when: not (vyos_blueprints_render_only | default(false) | bool)
