---
# Included from main.yml, except in render-only runs.
- name: Read the running version
  vyos.vyos.vyos_command:
    commands: [show version]
  register: _upgrade_before

- name: Note the running version
  ansible.builtin.set_fact:
    _upgrade_running: "{{ _upgrade_before.stdout[0] | regex_search('(?m)^Version:\\s*(.*)$', '\\1') | first | default('') | trim }}"

- name: Skip routers already running the expected version
  ansible.builtin.meta: end_host
  when:
    - upgrade_expected_version | length > 0
    - upgrade_expected_version in _upgrade_running

- name: Back up the configuration first
  ansible.builtin.include_role:
    name: vyos.blueprints.backup
  when: upgrade_backup | bool

- name: Stage and install the new image
  block:
    - name: The image URL contains no question mark
      # The VyOS shell treats "?" as a request for completions and waits for an answer,
      # so a command containing one never runs (e.g. a pre-signed URL with a query string).
      ansible.builtin.assert:
        that: "'?' not in upgrade_image_url"
        fail_msg: >-
          {{ inventory_hostname }}: upgrade_image_url contains "?", which the VyOS shell cannot take
          in a command; use a URL without a query string, or copy the image to the router and
          give its path.
        quiet: true
      when: _upgrade_remote | bool

    - name: Check the free space for the staged image
      vyos.vyos.vyos_command:
        commands: ["sudo df -Pm {{ upgrade_stage_dir | quote }}"]
      register: _upgrade_df
      when: _upgrade_remote | bool

    - name: There is room for the image
      ansible.builtin.assert:
        that: ((_upgrade_df.stdout[0].splitlines() | last).split()[3] | int) >= upgrade_stage_min_free_mb | int
        fail_msg: >-
          {{ inventory_hostname }}: less than {{ upgrade_stage_min_free_mb }} MB free in
          {{ upgrade_stage_dir }}: {{ _upgrade_df.stdout[0] | default('') }}
        quiet: true
      when: _upgrade_remote | bool

    - name: Download the image to the router (quietly)
      vyos.vyos.vyos_command:
        commands:
          # No "?" anywhere: in the VyOS shell "?" lists completions and waits for an answer.
          - >-
            {{ _upgrade_vrf_exec }}curl -sSfL --retry 3 -o {{ _upgrade_staged | quote }} {{ upgrade_image_url | quote }}
            && echo download-ok || echo download-failed
      vars:
        ansible_command_timeout: "{{ upgrade_command_timeout }}"
      register: _upgrade_download
      when: _upgrade_remote | bool

    - name: The image was downloaded
      ansible.builtin.assert:
        that: _upgrade_download.stdout[0] is search('(?m)^download-ok *$')
        fail_msg: "{{ inventory_hostname }}: downloading {{ upgrade_image_url }} failed: {{ _upgrade_download.stdout[0] | trim | truncate(400) }}"
        quiet: true
      when: _upgrade_remote | bool

    - name: Download the image signature, if there is one
      vyos.vyos.vyos_command:
        commands:
          - >-
            {{ _upgrade_vrf_exec }}curl -sSfL -o {{ (_upgrade_staged ~ '.minisig') | quote }}
            {{ (upgrade_image_url ~ '.minisig') | quote }} && echo signature-found || echo signature-missing
      register: _upgrade_sig_download
      when: _upgrade_remote | bool

    - name: Verify the signature as the VyOS installer does
      # validate_signature in vyos-1x image_installer.py: any key in /usr/share/vyos/keys.
      # The installer does not check a local file itself, so the role does it here.
      vyos.vyos.vyos_command:
        commands:
          - >-
            for k in /usr/share/vyos/keys/*.minisign.pub; do
            sudo minisign -V -q -p "$k" -m {{ _upgrade_staged | quote }} -x {{ (_upgrade_staged ~ '.minisig') | quote }}
            && { echo signature-valid; break; }; done; echo signature-checked
      register: _upgrade_sig_check
      when:
        - _upgrade_remote | bool
        - _upgrade_sig_download.stdout[0] is search('(?m)^signature-found *$')

    - name: The image signature is valid, or an unsigned image is allowed
      ansible.builtin.assert:
        that: >-
          (_upgrade_sig_check.stdout[0] | default('')) is search('(?m)^signature-valid *$')
          if _upgrade_sig_download.stdout[0] is search('(?m)^signature-found *$')
          else upgrade_allow_unsigned | bool
        fail_msg: >-
          {{ inventory_hostname }}:
          {{ 'the image signature is not valid'
             if _upgrade_sig_download.stdout[0] is search('(?m)^signature-found *$')
             else 'the image has no signature (' ~ upgrade_image_url ~ '.minisig); set upgrade_allow_unsigned to install it anyway' }}
        quiet: true
      when: _upgrade_remote | bool

    - name: No installation from an interrupted run is left over
      # An interrupted installer leaves /mnt/installation behind; the next "add system
      # image" then fails with "[Errno 17] File exists: '/mnt/installation/iso_src'".
      vyos.vyos.vyos_command:
        commands: ["sudo test -e /mnt/installation && echo installation-leftover || echo installation-clean"]
      register: _upgrade_leftover

    - name: The installer's working directory is free
      ansible.builtin.assert:
        that: _upgrade_leftover.stdout[0] is search('(?m)^installation-clean *$')
        fail_msg: >-
          {{ inventory_hostname }}: /mnt/installation exists, left by an interrupted install.
          Check "mount | grep /mnt/installation", unmount what it lists, then
          "sudo rm -rf /mnt/installation".
        quiet: true

    - name: Add the new image
      # The installer's questions for a local image, in order (VyOS 1.4.2 and 1.5): name,
      # default boot, copy config, copy SSH host keys; older releases word them differently. check_all is required: without it
      # network_cli answers only the first question of a command and the installer waits.
      # The installer asks no signature question for a local file. The role verified a
      # staged (URL) image; a path already on the router is installed as is.
      vyos.vyos.vyos_command:
        commands:
          - command: "{{ _upgrade_add_command }}"
            check_all: true
            # Wording differs between releases ("copy ..." in 1.4.2/1.5, "save ..." earlier).
            prompt:
              - What would you like to name this image
              - default one for boot
              - copy it to the new image|save the current configuration
              - SSH host keys
            answer:
              - "{{ upgrade_image_name }}"
              - "{{ _upgrade_yes_no[0] }}"
              - "{{ _upgrade_yes_no[1] }}"
              - "{{ _upgrade_yes_no[2] }}"
      vars:
        ansible_command_timeout: "{{ upgrade_command_timeout }}"
      register: _upgrade_add
      changed_when: true

    - name: The image installer did not stop on a signature question
      # Declining a question ends the installer with "Exiting from VyOS installation".
      ansible.builtin.assert:
        that: _upgrade_add.stdout[0] is not search('Exiting from VyOS installation')
        fail_msg: >-
          add system image stopped on {{ inventory_hostname }}:
          {{ 'the image signature is not valid'
             if _upgrade_add.stdout[0] is search('Signature is not valid')
             else 'the installer asked about a missing signature, which the role does not answer'
             if _upgrade_add.stdout[0] is search('Signature is not available')
             else 'the installer exited' }}
        quiet: true

    - name: The image installer got as far as copying the image
      # "add system image" prints no success message, but "Copying system image files"
      # only after download, checks and signature validation succeeded (VyOS 1.4 and 1.5).
      # Failures before it ("The image cannot be fetched from ...", a full disk, a wrong
      # architecture) end the installer without it.
      ansible.builtin.assert:
        that: _upgrade_add.stdout[0] is search('Copying system image files')
        fail_msg: >-
          add system image did not install the image on {{ inventory_hostname }}; the
          installer said: {{ _upgrade_add.stdout[0] | default('') | trim | truncate(600) }}
        quiet: true

    - name: The image installer reported no error
      # The installer can print "Error: ..." after copying everything (vyos.dev T7668).
      ansible.builtin.assert:
        that: _upgrade_add.stdout[0] is not search('(?im)^\s*(error|failed)(?![A-Za-z0-9_])')
        fail_msg: "add system image failed on {{ inventory_hostname }}: {{ _upgrade_add.stdout[0] | regex_search('(?im)^\\s*(error|failed).*$') }}"
        quiet: true

  always:
    - name: Remove the staged image
      vyos.vyos.vyos_command:
        commands: ["sudo rm -f {{ _upgrade_staged | quote }} {{ (_upgrade_staged ~ '.minisig') | quote }}"]
      when: _upgrade_remote | bool
      changed_when: false

- name: Read the installed images
  vyos.vyos.vyos_command:
    commands: [show system image]
  register: _upgrade_images

- name: Locate the new image in the image list
  # "show system image" is a table; the Default boot column is found from the
  # header, because "Yes" in the Running column must not count as default.
  ansible.builtin.set_fact:
    _upgrade_image_line: "{{ _upgrade_lines | select('match', '^' ~ (_upgrade_name | regex_escape) ~ '\\s') | first | default('') }}"
    _upgrade_default_col: "{{ (_upgrade_lines | select('match', '^Name\\s') | first | default('')).find('Default boot') }}"
  vars:
    _upgrade_lines: "{{ _upgrade_images.stdout[0].splitlines() }}"
    _upgrade_name: "{{ upgrade_image_name or ((_upgrade_add.stdout[0] | regex_search('\\(Default: ([^)]+)\\)', '\\1') or ['']) | first) }}"

- name: The new image is installed (and is the default boot image)
  ansible.builtin.assert:
    that:
      - _upgrade_image_line | length > 0
      - >-
        not (upgrade_set_default | bool)
        or (_upgrade_default_col | int >= 0
            and _upgrade_image_line[_upgrade_default_col | int:(_upgrade_default_col | int) + 3] == 'Yes')
    fail_msg: "the new image is not listed{{ ' as default boot' if upgrade_set_default | bool else '' }} on {{ inventory_hostname }}"
    quiet: true

- name: Reboot into the new image and verify it
  ansible.builtin.include_tasks: reboot.yml
  when: upgrade_reboot | bool
