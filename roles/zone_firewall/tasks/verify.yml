---
- name: Read zone policy
  vyos.vyos.vyos_command:
    commands:
      - show firewall zone-policy
  register: _zone_firewall_v

- name: Every zone is active
  ansible.builtin.assert:
    # plain word/substring tests; regex escapes behave differently depending on how ansible-core evaluates the condition
    that: item.name in (_zone_firewall_v.stdout[0].splitlines() | map('trim') | select | map('split') | map('first') | list)
    fail_msg: "zone {{ item.name }} is missing from 'show firewall zone-policy'"
    quiet: true
  loop: "{{ zone_firewall_zones }}"
  loop_control:
    label: "{{ item.name }}"

- name: Member interfaces are bound
  ansible.builtin.assert:
    that: item.1 in (_zone_firewall_v.stdout[0] | split)
    fail_msg: >-
      interface {{ item.1 }} of zone {{ item.0.name }} is not bound; 'show firewall zone-policy' returned:
      {{ _zone_firewall_v.stdout[0] | default('') | truncate(800) }}
    quiet: true
  loop: "{{ zone_firewall_zones | subelements('interfaces', skip_missing=true) }}"
  loop_control:
    label: "{{ item.0.name }} {{ item.1 }}"
