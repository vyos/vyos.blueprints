---
- name: Read BGP sessions
  vyos.vyos.vyos_command:
    commands:
      - show bgp summary
  register: _bgp_v
  when: bgp_neighbors | length > 0

- name: Every BGP session is established
  # An established neighbour shows its Up/Down time followed by a prefix count.
  ansible.builtin.assert:
    that: >-
      _bgp_v.stdout[0] is search('(?m)^' ~ (item.address | regex_escape)
      ~ '\s.*\s(\d{2}:\d{2}:\d{2}|\d+[dwh]\S*)\s+\d+\b')
    fail_msg: "BGP session to {{ item.address }} is not established"
    quiet: true
  loop: "{{ bgp_neighbors }}"
  loop_control:
    label: "{{ item.address }}"
