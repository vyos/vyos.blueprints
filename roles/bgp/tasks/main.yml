---
- name: Configure BGP (skipped when bgp_asn is not set)
  when: bgp_asn is not none and bgp_asn | string | length > 0
  block:
    - name: Configure the BGP process and neighbours
      vyos.vyos.vyos_bgp_global:
        config: "{{ lookup('ansible.builtin.template', 'bgp_global.yml.j2') | from_yaml }}"
        state: "{{ _bgp_state }}"
      register: _bgp_r_global
      no_log: "{{ bgp_neighbors | selectattr('password', 'defined') | list | length > 0 }}"

    - name: Configure networks, redistribution and per-neighbour policy
      vyos.vyos.vyos_bgp_address_family:
        config: "{{ _bgp_af }}"
        state: "{{ _bgp_state }}"
      vars:
        _bgp_af: "{{ lookup('ansible.builtin.template', 'bgp_address_family.yml.j2') | from_yaml }}"
      register: _bgp_r_af
      when: _bgp_af | length > 1

    - name: Log neighbour changes
      # Not via vyos_bgp_global: it renders "no-client-to-client-reflection"
      # whenever log_neighbor_changes is set.
      vyos.vyos.vyos_config:
        lines: [set protocols bgp parameters log-neighbor-changes]
      register: _bgp_r_log
      when:
        - bgp_log_neighbor_changes | bool
        - not (vyos_blueprints_render_only | default(false) | bool)

    - name: Collect rendered commands  # noqa: var-naming[no-role-prefix] - shared across roles by design
      ansible.builtin.set_fact:
        vyos_blueprints_rendered: >-
          {{ vyos_blueprints_rendered | default([])
             + ([_bgp_r_global, _bgp_r_af] | selectattr('rendered', 'defined') | map(attribute='rendered') | flatten | unique)
             + (['set protocols bgp parameters log-neighbor-changes'] if bgp_log_neighbor_changes | bool else []) }}
      when: vyos_blueprints_render_only | default(false) | bool
