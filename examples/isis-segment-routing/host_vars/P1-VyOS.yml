---
# P1 as on the page; its eth3 link (192.0.2.21/30) is not in the lab topology
base_hostname: P1-VyOS
base_interfaces:
  - name: dum0
    addresses:
      - 192.0.2.1/32
  - name: eth1
    mtu: 8000
    addresses:
      - 192.0.2.5/30
  - name: eth3
    mtu: 8000
    addresses:
      - 192.0.2.21/30
isis_net: 49.0000.0000.0000.0001.00
isis_interfaces:
  - name: dum0
    passive: true
  - name: eth1
    network: point-to-point
  - name: eth3
    network: point-to-point
isis_segment_routing:
  maximum_label_depth: 8
  prefixes:
    - prefix: 192.0.2.1/32
      index: 1
isis_mpls_interfaces:
  - eth1
  - eth3
