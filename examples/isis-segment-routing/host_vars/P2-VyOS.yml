---
# P2 as on the page; its eth3 link (192.0.2.26/30) is not in the lab topology
base_hostname: P2-VyOS
base_interfaces:
  - name: dum0
    addresses:
      - 192.0.2.2/32
  - name: eth2
    mtu: 8000
    addresses:
      - 192.0.2.17/30
  - name: eth3
    mtu: 8000
    addresses:
      - 192.0.2.26/30
isis_net: 49.0000.0000.0000.0002.00
isis_interfaces:
  - name: dum0
    passive: true
  - name: eth2
    network: point-to-point
  - name: eth3
    network: point-to-point
isis_segment_routing:
  maximum_label_depth: 8
  prefixes:
    - prefix: 192.0.2.2/32
      index: 2
isis_mpls_interfaces:
  - eth2
  - eth3
