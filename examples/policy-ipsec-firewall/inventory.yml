---
# docs.vyos.io/en/1.5/configexamples/policy-based-ipsec-and-firewall.html
all:
  children:
    sites:
      hosts:
        left:
          ansible_host: clab-policy-ipsec-firewall-left    # your router's address
        right:
          ansible_host: clab-policy-ipsec-firewall-right
  vars:
    ansible_network_os: vyos.vyos.vyos
    ansible_connection: ansible.netcommon.network_cli
    ansible_user: admin
    ansible_password: admin                             # use ansible-vault for real devices
