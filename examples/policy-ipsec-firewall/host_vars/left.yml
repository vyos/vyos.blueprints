---
# WAN is eth3 here, eth0 on the page (containerlab uses eth0 for management).
# Input rule 5 keeps containerlab management reachable - drop it on a real router
# and make sure your management source is allowed (rule 20, TRUSTED) instead.
ipsec_policy_based_peers:
  - name: RIGHT
    psk_name: RIGHT
    psk: p4ssw0rd                      # use ansible-vault for real devices
    authentication_ids: false
    local_address: 198.51.100.14
    remote_address: 192.0.2.130
    connection_type: initiate
    tunnels:
      - {id: 0, local_prefix: 10.1.11.0/24, remote_prefix: 10.2.21.0/24}
      - {id: 1, local_prefix: 10.1.11.0/24, remote_prefix: 10.2.22.0/24}
      - {id: 2, local_prefix: 10.1.12.0/24, remote_prefix: 10.2.21.0/24}
      - {id: 3, local_prefix: 10.1.12.0/24, remote_prefix: 10.2.22.0/24}
ipsec_policy_based_default_gateway: 198.51.100.13
firewall_groups:
  network:
    - name: LOCAL-NETS
      networks: [10.1.11.0/24, 10.1.12.0/24]
    - name: REMOTE-NETS
      networks: [10.2.21.0/24, 10.2.22.0/24]
    - name: TRUSTED
      networks: [198.51.100.125/32, 203.0.113.0/24, 10.1.11.0/24, 192.168.70.0/24]
firewall_ipv4:
  forward:
    default_action: drop
    rules:
      - number: 1
        action: accept
        state: {established: true, related: true}
      - number: 2
        action: drop
        state: {invalid: true}
      - number: 10
        action: accept
        source:
          group: {network_group: LOCAL-NETS}
      - number: 20
        action: accept
        source:
          group: {network_group: REMOTE-NETS}
        destination:
          group: {network_group: LOCAL-NETS}
  input:
    default_action: drop
    rules:
      - number: 1
        action: accept
        state: {established: true, related: true}
      - number: 2
        action: drop
        state: {invalid: true}
      - number: 5
        action: accept
        description: containerlab management
        inbound_interface: {name: eth0}
      - number: 10
        action: accept
        protocol: udp
        destination: {port: '500,4500'}
        inbound_interface: {name: eth3}
      - number: 15
        action: accept
        protocol: esp
        inbound_interface: {name: eth3}
      - number: 20
        action: accept
        protocol: tcp
        destination: {port: '22'}
        source:
          group: {network_group: TRUSTED}
      - number: 25
        action: accept
        protocol: udp
        destination: {port: '53'}
        source:
          group: {network_group: LOCAL-NETS}
      - {number: 30, action: accept, protocol: icmp}
nat_source_rules:
  - id: 10
    exclude: true
    outbound_interface: {name: eth3}
    source: {network_group: LOCAL-NETS}
    destination: {network_group: REMOTE-NETS}
  - id: 20
    outbound_interface: {name: eth3}
    source: {network_group: LOCAL-NETS}
    translation: {address: masquerade}
base_interfaces:
  - name: eth3
    addresses: [198.51.100.14/30]
  - name: eth1.111
    addresses: [10.1.11.1/24]
  - name: eth2.112
    addresses: [10.1.12.1/24]
