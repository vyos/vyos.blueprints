---
- name: Policy-based IPsec with firewall and NAT
  hosts: sites
  gather_facts: false
  roles:
    - vyos.blueprints.base
    - vyos.blueprints.ipsec_policy_based
    # firewall and nat only have inputs on LEFT, as on the page; on RIGHT they do nothing
    - vyos.blueprints.firewall
    - vyos.blueprints.nat
  post_tasks:
    - name: Show rendered commands
      ansible.builtin.debug:
        var: vyos_blueprints_rendered
      when: show_rendered | default(false) | bool
