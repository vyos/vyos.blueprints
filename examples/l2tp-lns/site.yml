---
- name: L2TP network server for PPPoE subscribers forwarded by a LAC
  hosts: lns
  gather_facts: false
  roles:
    - vyos.blueprints.base       # address and default route
    - vyos.blueprints.nat        # masquerade the client pool
    - vyos.blueprints.l2tp_lns   # LNS with RADIUS authentication
  post_tasks:
    - name: Show rendered commands
      ansible.builtin.debug:
        var: vyos_blueprints_rendered
      when: show_rendered | default(false) | bool
