---
- name: FlexVPN spoke - GRE over IPsec to a Cisco hub
  hosts: spoke
  gather_facts: false
  roles:
    - vyos.blueprints.gre_tunnel
    - vyos.blueprints.ipsec_policy_based
  post_tasks:
    - name: Show rendered commands
      ansible.builtin.debug:
        var: vyos_blueprints_rendered
      when: show_rendered | default(false) | bool
