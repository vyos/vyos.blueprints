---
# docs.vyos.io/en/1.5/configexamples/qos.html
all:
  children:
    qos:
      hosts:
        vyos3:
          ansible_host: clab-qos-vyos3   # your router's address
        vyos2:
          ansible_host: clab-qos-vyos2
        # vyos4:                        # add with its address on a real network
  vars:
    ansible_network_os: vyos.vyos.vyos
    ansible_connection: ansible.netcommon.network_cli
    ansible_user: admin
    ansible_password: admin            # use ansible-vault for real devices
