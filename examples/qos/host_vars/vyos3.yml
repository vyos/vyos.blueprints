---
# interfaces shifted by one (containerlab uses eth0 for management)
base_hostname: vyos3
base_interfaces:
  - name: eth1
    addresses:
      - 10.1.1.100/24
  - name: eth2
    addresses:
      - 172.17.1.1/24
base_static_routes:
  - dest: 0.0.0.0/0
    next_hop: 10.1.1.1
qos_shapers:
  - name: vyos3
    classes:
      - id: 10
        set_dscp: CS4
        matches:
          - name: ADDRESS10
            ip:
              source:
                address: 172.17.1.2/32
      - id: 20
        set_dscp: CS5
        matches:
          - name: ADDRESS20
            ip:
              source:
                address: 172.17.1.3/32
      - id: 30
        set_dscp: CS6
        matches:
          - name: ADDRESS30
            ip:
              source:
                address: 172.17.1.4/32
    default:
      bandwidth: 10%
      ceiling: 100%
      priority: 7
      queue_type: fair-queue
qos_interfaces:
  - name: eth1
    egress: vyos3
