name: zone-policy
topology:
  nodes:
    fw1:
      kind: vyosnetworks_vyos
      image: ${VYOS_IMAGE:=vyos:latest}
    # one host per network on its own VLAN, behind a VLAN-aware bridge
    sw:
      kind: linux
      image: alpine:3
      exec:
        - ip link add br0 type bridge vlan_filtering 1
        - ip link set eth1 master br0
        - ip link set eth2 master br0
        - ip link set eth3 master br0
        - ip link set eth4 master br0
        - bridge vlan add dev eth1 vid 10
        - bridge vlan add dev eth1 vid 20
        - bridge vlan add dev eth1 vid 30
        - bridge vlan add dev eth2 vid 10 pvid untagged
        - bridge vlan add dev eth3 vid 20 pvid untagged
        - bridge vlan add dev eth4 vid 30 pvid untagged
        - ip link set br0 up
    wan:
      kind: linux
      image: alpine:3
      exec: ["ip addr add 172.16.10.100/24 dev eth1", "ip route replace default via 172.16.10.1"]
    lan:
      kind: linux
      image: alpine:3
      exec: ["ip addr add 192.168.100.10/24 dev eth1", "ip route replace default via 192.168.100.1"]
    dmz:
      kind: linux
      image: alpine:3
      exec: ["ip addr add 192.168.200.200/24 dev eth1", "ip route replace default via 192.168.200.1"]
  links:
    - endpoints: ["fw1:eth1", "sw:eth1"]
    - endpoints: ["sw:eth2", "wan:eth1"]
    - endpoints: ["sw:eth3", "lan:eth1"]
    - endpoints: ["sw:eth4", "dmz:eth1"]
