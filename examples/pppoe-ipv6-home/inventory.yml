---
# docs.vyos.io/en/1.5/configexamples/pppoe-ipv6-basic.html
all:
  children:
    home:
      hosts:
        r1:
          ansible_host: clab-pppoe-ipv6-home-r1 # your router's address
    provider:
      hosts:
        isp:
          ansible_host: clab-pppoe-ipv6-home-isp # lab only, see isp.yml
  vars:
    ansible_network_os: vyos.vyos.vyos
    ansible_connection: ansible.netcommon.network_cli
    ansible_user: admin
    ansible_password: admin # use ansible-vault for real devices
