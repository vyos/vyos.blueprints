---
# docs.vyos.io/en/1.5/configexamples/dmvpn-dualhub-dualcloud.html - the VyOS
# hubs and spokes (Spoke-1 is the Cisco router on the page).
all:
  children:
    dmvpn:
      hosts:
        hub1:
          ansible_host: clab-dmvpn-dual-hub-hub1 # your router's address
        hub2:
          ansible_host: clab-dmvpn-dual-hub-hub2
        spoke2:
          ansible_host: clab-dmvpn-dual-hub-spoke2
        spoke3:
          ansible_host: clab-dmvpn-dual-hub-spoke3
  vars:
    ansible_network_os: vyos.vyos.vyos
    ansible_connection: ansible.netcommon.network_cli
    ansible_user: admin
    ansible_password: admin # use ansible-vault for real devices
