---
- name: VRFs and firewall
  hosts: router
  gather_facts: false
  roles:
    - vyos.blueprints.base
    - vyos.blueprints.vrf_firewall
  post_tasks:
    - name: Show rendered commands
      ansible.builtin.debug:
        var: vyos_blueprints_rendered
      when: show_rendered | default(false) | bool
