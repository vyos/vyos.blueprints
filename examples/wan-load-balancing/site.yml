---
- name: WAN load balancing
  hosts: wan
  gather_facts: false
  roles:
    - vyos.blueprints.base               # addresses and routes to the ping targets
    - vyos.blueprints.wan_load_balance   # health checks and rules
  post_tasks:
    - name: Show rendered commands
      ansible.builtin.debug:
        var: vyos_blueprints_rendered
      when: show_rendered | default(false) | bool
