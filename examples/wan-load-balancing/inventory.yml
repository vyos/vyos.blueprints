---
# docs.vyos.io/en/1.5/configexamples/wan-load-balancing.html
all:
  children:
    wan:
      hosts:
        r1:
          ansible_host: clab-wan-load-balancing-r1 # your router's address
  vars:
    ansible_network_os: vyos.vyos.vyos
    ansible_connection: ansible.netcommon.network_cli
    ansible_user: admin
    ansible_password: admin # use ansible-vault for real devices
