---
- name: Small-office internet edge
  hosts: edge
  gather_facts: false
  roles:
    - vyos.blueprints.base
    - vyos.blueprints.edge_nat
  post_tasks:
    - name: Show rendered commands
      ansible.builtin.debug:
        var: vyos_blueprints_rendered
      when: show_rendered | default(false) | bool
