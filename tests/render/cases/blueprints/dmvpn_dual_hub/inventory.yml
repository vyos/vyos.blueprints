---
# The page shows no tunnel-interface block for Spoke-3; it gets Spoke-2's
# tunnels with .13 addresses (its NHRP block on the page matches Spoke-2's).
all:
  hosts:
    HUB-1:
      base_interfaces:
        - name: eth0
          addresses:
            - 10.0.0.2/30
      base_static_routes:
        - dest: 0.0.0.0/0
          next_hop: 10.0.0.1
      gre_tunnel_interfaces:
        - name: tun100
          addresses:
            - 10.100.100.1/32
          enable_multicast: true
          encapsulation: gre
          adjust_mss: "1360"
          mtu: 1436
          key: 42
          source_interface: eth0
      dmvpn_nhrp_tunnels:
        - name: tun100
          authentication: vyos
          holdtime: 300
          multicast: dynamic
          network_id: 1
          redirect: true
          registration_no_unique: true
      ospf_interfaces:
        - name: tun100
          area: "0"
          network: point-to-multipoint
          passive: false
      ansible_host: 192.0.2.1
      base_hostname: HUB-1
    HUB-2:
      base_interfaces:
        - name: eth0
          addresses:
            - 10.0.1.2/30
      base_static_routes:
        - dest: 0.0.0.0/0
          next_hop: 10.0.1.1
      gre_tunnel_interfaces:
        - name: tun101
          addresses:
            - 10.100.101.1/32
          enable_multicast: true
          encapsulation: gre
          adjust_mss: "1360"
          mtu: 1436
          key: 43
          source_interface: eth0
      dmvpn_nhrp_tunnels:
        - name: tun101
          authentication: vyos
          holdtime: 300
          multicast: dynamic
          network_id: 2
          redirect: true
          registration_no_unique: true
      ospf_interfaces:
        - name: tun101
          area: "0"
          network: point-to-multipoint
          passive: false
      ansible_host: 192.0.2.2
      base_hostname: HUB-2
    SPOKE-2:
      base_interfaces:
        - name: eth0
          addresses:
            - 10.0.12.2/30
        - name: eth1
          addresses:
            - 192.168.12.1/24
      base_static_routes:
        - dest: 0.0.0.0/0
          next_hop: 10.0.12.1
      gre_tunnel_interfaces:
        - name: tun100
          addresses:
            - 10.100.100.12/32
          enable_multicast: true
          encapsulation: gre
          adjust_mss: "1360"
          mtu: 1436
          key: 42
          source_interface: eth0
        - name: tun101
          addresses:
            - 10.100.101.12/32
          enable_multicast: true
          encapsulation: gre
          adjust_mss: "1360"
          mtu: 1436
          key: 43
          source_interface: eth0
      dmvpn_nhrp_tunnels:
        - name: tun100
          authentication: vyos
          holdtime: 300
          multicast: 10.0.0.2
          network_id: 1
          nhs:
            - tunnel_ip: dynamic
              nbma: 10.0.0.2
          registration_no_unique: true
          shortcut: true
        - name: tun101
          authentication: vyos
          holdtime: 300
          multicast: 10.0.1.2
          network_id: 2
          nhs:
            - tunnel_ip: dynamic
              nbma: 10.0.1.2
          registration_no_unique: true
          shortcut: true
      ospf_interfaces:
        - name: eth1
          area: "0"
        - name: tun100
          area: "0"
          network: point-to-multipoint
          passive: false
        - name: tun101
          area: "0"
          network: point-to-multipoint
          passive: false
      ansible_host: 192.0.2.3
      base_hostname: SPOKE-2
    SPOKE-3:
      base_interfaces:
        - name: eth0
          addresses:
            - 10.0.13.2/30
        - name: eth1
          addresses:
            - 192.168.13.1/24
      base_static_routes:
        - dest: 0.0.0.0/0
          next_hop: 10.0.13.1
      gre_tunnel_interfaces:
        - name: tun100
          addresses:
            - 10.100.100.13/32
          enable_multicast: true
          encapsulation: gre
          adjust_mss: "1360"
          mtu: 1436
          key: 42
          source_interface: eth0
        - name: tun101
          addresses:
            - 10.100.101.13/32
          enable_multicast: true
          encapsulation: gre
          adjust_mss: "1360"
          mtu: 1436
          key: 43
          source_interface: eth0
      dmvpn_nhrp_tunnels:
        - name: tun100
          authentication: vyos
          holdtime: 300
          multicast: 10.0.0.2
          network_id: 1
          nhs:
            - tunnel_ip: dynamic
              nbma: 10.0.0.2
          registration_no_unique: true
          shortcut: true
        - name: tun101
          authentication: vyos
          holdtime: 300
          multicast: 10.0.1.2
          network_id: 2
          nhs:
            - tunnel_ip: dynamic
              nbma: 10.0.1.2
          registration_no_unique: true
          shortcut: true
      ospf_interfaces:
        - name: eth1
          area: "0"
        - name: tun100
          area: "0"
          network: point-to-multipoint
          passive: false
        - name: tun101
          area: "0"
          network: point-to-multipoint
          passive: false
      ansible_host: 192.0.2.4
      base_hostname: SPOKE-3
  vars:
    ansible_network_os: vyos.vyos.vyos
    ansible_connection: ansible.netcommon.network_cli
    ansible_user: vyos
    ansible_connect_timeout: 5
    ansible_command_timeout: 5
