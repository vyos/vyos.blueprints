---
# docs.vyos.io/en/1.5/configexamples/wan-load-balancing.html - Example 5: Exclude traffic from load balancing
# (the end state after applying the page's steps up to this example)
base_hostname: r1
base_static_routes:
  - { dest: 33.44.55.66/32, next_hop: 11.22.33.1 }
  - { dest: 44.55.66.77/32, next_hop: 11.22.33.1 }
  - { dest: 55.66.77.88/32, next_hop: 22.33.44.1 }
  - { dest: 66.77.88.99/32, next_hop: 22.33.44.1 }
  - { dest: 0.0.0.0/0, next_hop: 11.22.33.1 }
wan_load_balance_interfaces:
  - name: eth0
    failure_count: 5
    nexthop: 11.22.33.1
    tests:
      - { id: 10, type: ping, target: 33.44.55.66 }
      - { id: 20, type: ping, target: 44.55.66.77 }
  - name: eth1
    failure_count: 4
    nexthop: 22.33.44.1
    tests:
      - { id: 10, type: ping, target: 55.66.77.88 }
      - { id: 20, type: ping, target: 66.77.88.99 }
wan_load_balance_rules:
  - number: 5
    exclude: true
    inbound_interface: eth+
    destination: { address: 10.0.0.0/8 }
  - number: 10
    inbound_interface: eth2
    interfaces:
      - { name: eth0 }
  - number: 20
    inbound_interface: eth2
    interfaces:
      - { name: eth1 }
    destination: { port: sip }
    protocol: tcp
