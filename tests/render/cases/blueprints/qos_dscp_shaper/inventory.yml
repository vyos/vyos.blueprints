---
# docs.vyos.io/en/1.5/configexamples/qos.html
# vyos2's class 20 (5 Mbit/s for 10.1.1.100) is shown on the page as "show"
# output; it is translated to the equivalent settings here. The page's text
# says vyos2 re-marks "CS4 -> CS6" once, but its configuration sets CS5 (as the
# introduction says); the configuration is followed.
all:
  hosts:
    vyos3:
      ansible_host: 192.0.2.3
      base_hostname: vyos3
      base_interfaces:
        - {name: eth0, addresses: [10.1.1.100/24]}
        - {name: eth1, addresses: [172.17.1.1/24]}
      base_static_routes:
        - {dest: 0.0.0.0/0, next_hop: 10.1.1.1}
      qos_shapers:
        - name: vyos3
          classes:
            - {id: 10, set_dscp: CS4, matches: [{name: ADDRESS10, ip: {source: {address: 172.17.1.2/32}}}]}
            - {id: 20, set_dscp: CS5, matches: [{name: ADDRESS20, ip: {source: {address: 172.17.1.3/32}}}]}
            - {id: 30, set_dscp: CS6, matches: [{name: ADDRESS30, ip: {source: {address: 172.17.1.4/32}}}]}
          default: {bandwidth: 10%, ceiling: 100%, priority: 7, queue_type: fair-queue}
      qos_interfaces:
        - {name: eth0, egress: vyos3}
    vyos4:
      ansible_host: 192.0.2.4
      base_hostname: vyos4
      base_interfaces:
        - {name: eth0, addresses: [10.2.1.100/24]}
      base_static_routes:
        - {dest: 0.0.0.0/0, next_hop: 10.2.1.1}
      qos_shapers:
        - name: vyos4
          classes:
            - {id: 10, bandwidth: 100%, burst: 15k, queue_type: fair-queue, set_dscp: CS4, matches: [{name: ALL, ether: {protocol: all}}]}
          default: {bandwidth: 10%, burst: 15k, ceiling: 100%, priority: 7, queue_type: fair-queue}
      qos_interfaces:
        - {name: eth0, egress: vyos4}
    vyos2:
      ansible_host: 192.0.2.2
      base_hostname: vyos2
      base_interfaces:
        - {name: eth0, addresses: [10.1.1.1/24]}
        - {name: eth1, addresses: [10.2.1.1/24]}
        - {name: eth2, addresses: [10.9.9.1/24]}
      base_static_routes:
        - {dest: 172.17.1.0/24, next_hop: 10.1.1.100}
      qos_shapers:
        - name: vyos2
          classes:
            - {id: 10, bandwidth: 100%, burst: 15k, queue_type: fair-queue, set_dscp: CS5, matches: [{name: VYOS2, ip: {dscp: CS4}}]}
            - {id: 20, bandwidth: 5mbit, description: for VyOS3 eth0, matches: [{name: VyOS3, ip: {source: {address: 10.1.1.100/32}}}]}
          default: {bandwidth: 100%, burst: 15k, ceiling: 100%, priority: 7, queue_type: fair-queue}
      qos_interfaces:
        - {name: eth2, egress: vyos2}
  vars:
    ansible_network_os: vyos.vyos.vyos
    ansible_connection: ansible.netcommon.network_cli
    ansible_user: vyos
    ansible_connect_timeout: 5
    ansible_command_timeout: 5
