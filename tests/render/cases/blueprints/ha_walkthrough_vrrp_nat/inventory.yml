---
all:
  children:
    routers:
      hosts:
        router1:
          ansible_host: 192.0.2.1
          base_interfaces:
            - name: eth0.50
              addresses:
                - 192.0.2.21/24
            - name: eth0.100
              addresses:
                - 203.0.113.2/24
            - name: eth0.201
              addresses:
                - 10.200.201.2/24
          ha_vrrp_priority: 200
          ha_vrrp_groups:
            - name: int
              vrid: 201
              interface: eth0.201
              address:
                - 10.200.201.1/24
            - name: public
              vrid: 113
              interface: eth0.100
              address:
                - 203.0.113.1/24
          ha_vrrp_local_addresses:
            int: 10.200.201.2
            public: 203.0.113.2
          ha_vrrp_conntrack_sync:
            interface: eth0.201
            accept_protocols:
              - tcp
              - udp
              - icmp
            event_listen_queue_size: 8
            mcast_group: 224.0.0.50
            sync_queue_size: 8
            disable_helpers: true
          nat_source_rules:
            - id: 10
              outbound_interface:
                name: eth0.50
              source:
                address: 10.200.201.0/24
              destination:
                address: '!192.0.2.0/24'
              translation:
                address: 203.0.113.1
        router2:
          ansible_host: 192.0.2.2
          base_interfaces:
            - name: bond0.50
              addresses:
                - 192.0.2.22/24
            - name: bond0.100
              addresses:
                - 203.0.113.3/24
            - name: bond0.201
              addresses:
                - 10.200.201.3/24
          ha_vrrp_priority: 100
          ha_vrrp_groups:
            - name: int
              vrid: 201
              interface: bond0.201
              address:
                - 10.200.201.1/24
            - name: public
              vrid: 113
              interface: bond0.100
              address:
                - 203.0.113.1/24
          ha_vrrp_local_addresses:
            int: 10.200.201.3
            public: 203.0.113.3
          ha_vrrp_conntrack_sync:
            interface: bond0.201
            accept_protocols:
              - tcp
              - udp
              - icmp
            event_listen_queue_size: 8
            mcast_group: 224.0.0.50
            sync_queue_size: 8
            disable_helpers: true
          nat_source_rules:
            - id: 10
              outbound_interface:
                name: bond0.50
              source:
                address: 10.200.201.0/24
              destination:
                address: '!192.0.2.0/24'
              translation:
                address: 203.0.113.1
          bonding_interfaces:
            - name: bond0
              description: Switch Port-Channel
              hash_policy: layer2
              members:
                - eth0
                - eth1
              mode: 802.3ad
  vars:
    ansible_network_os: vyos.vyos.vyos
    ansible_connection: ansible.netcommon.network_cli
    ansible_user: vyos
    ansible_connect_timeout: 5
    ansible_command_timeout: 5
