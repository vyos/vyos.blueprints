---
# router2: the page says "identical, but use BGPPREPENDOUT". Following the
# page's Example Network (upstream 192.0.2.11/.12, ours .21/.22), router2 peers
# with 192.0.2.12 from 192.0.2.22.
all:
  hosts:
    router1:
      ansible_host: 192.0.2.1
      bgp_router_id: 192.0.2.21
      bgp_neighbors:
        - {address: 192.0.2.11, remote_as: 65550, update_source: 192.0.2.21, soft_reconfiguration_inbound: true, route_map_export: BGPOUT}
    router2:
      ansible_host: 192.0.2.2
      bgp_router_id: 192.0.2.22
      bgp_neighbors:
        - {address: 192.0.2.12, remote_as: 65550, update_source: 192.0.2.22, soft_reconfiguration_inbound: true, route_map_export: BGPPREPENDOUT}
  vars:
    ansible_network_os: vyos.vyos.vyos
    ansible_connection: ansible.netcommon.network_cli
    ansible_user: vyos
    ansible_connect_timeout: 5
    ansible_command_timeout: 5
