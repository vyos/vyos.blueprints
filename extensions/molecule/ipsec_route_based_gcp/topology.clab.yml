name: bp-gcp
topology:
  kinds:
    vyosnetworks_vyos:
      image: ${VYOS_IMAGE:=vyos:blueprints-ci}
  nodes:
    edge1:
      kind: vyosnetworks_vyos
    edge2:
      kind: vyosnetworks_vyos
    # one VyOS standing in for the Google Cloud HA VPN gateway (both interfaces) and Cloud Router
    gcp:
      kind: vyosnetworks_vyos
    isp:
      kind: linux
      image: alpine:3
      exec:
        - sysctl -w net.ipv4.ip_forward=1
        - ip link add br0 type bridge
        - ip link set eth1 master br0
        - ip link set eth2 master br0
        - ip link set br0 up
        - ip addr add 198.51.100.1/24 dev br0
        - ip addr add 203.0.113.1/24 dev eth3
    # shared edge LAN 10.80.0.0/24 behind both edges
    lan:
      kind: linux
      image: alpine:3
      exec:
        - ip link add br0 type bridge
        - ip link set eth1 master br0
        - ip link set eth2 master br0
        - ip link set br0 up
        - ip addr add 10.80.0.10/24 dev br0
        - ip route replace default via 10.80.0.11
    vm:
      kind: linux
      image: alpine:3
      exec: ["ip addr add 10.70.0.10/20 dev eth1", "ip route replace default via 10.70.0.1"]
  links:
    # WAN is eth1 here (eth0 on the page; eth0 is containerlab management)
    - endpoints: ["edge1:eth1", "isp:eth1"]
    - endpoints: ["edge2:eth1", "isp:eth2"]
    - endpoints: ["gcp:eth1", "isp:eth3"]
    - endpoints: ["edge1:eth2", "lan:eth1"]
    - endpoints: ["edge2:eth2", "lan:eth2"]
    - endpoints: ["gcp:eth2", "vm:eth1"]
