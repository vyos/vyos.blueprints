---
- name: Verify role state
  hosts: vpn
  gather_facts: false
  tasks:
    - name: Wait for IKE and IPsec
      ansible.builtin.pause:
        seconds: 30
      run_once: true

    - name: Run role checks
      ansible.builtin.include_role:
        name: vyos.blueprints.ipsec_policy_based
        tasks_from: verify

- name: Verify traffic through both selectors, as in the page's "Checking Connectivity"
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Ping across the VPN
      ansible.builtin.command:
        cmd: docker exec clab-bp-ipsec-pol-{{ item.from }} ping -c 3 -W 2 {{ item.to }}
      become: "{{ lookup('ansible.builtin.env', 'CLAB_BECOME', default='true') | bool }}"
      changed_when: false
      loop:
        - {from: pc1, to: 192.168.10.2}
        - {from: pc2, to: 192.168.11.2}
        - {from: pc3, to: 192.168.0.2}
      loop_control:
        label: "{{ item.from }} -> {{ item.to }}"
