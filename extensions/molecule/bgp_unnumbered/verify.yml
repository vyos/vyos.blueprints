---
- name: Verify
  hosts: fabric
  gather_facts: false
  tasks:
    - name: Wait for BGP sessions and routes
      ansible.builtin.pause:
        seconds: 45
      run_once: true

    - name: Run role checks
      ansible.builtin.include_role:
        name: vyos.blueprints.bgp_unnumbered
        tasks_from: verify

    - name: Ping the other router's loopback from this loopback, as on the docs page
      vyos.vyos.vyos_ping:
        dest: "{{ '192.168.0.2' if inventory_hostname == 'r1' else '192.168.0.1' }}"
        source: "{{ bgp_unnumbered_router_id }}"
        count: 3
