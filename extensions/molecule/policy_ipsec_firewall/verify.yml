---
- name: Verify role state
  hosts: sites
  gather_facts: false
  tasks:
    - name: Wait for IKE and IPsec
      ansible.builtin.pause:
        seconds: 30
      run_once: true

    - name: Run role checks
      ansible.builtin.include_role:
        name: "vyos.blueprints.{{ item }}"
        tasks_from: verify
      loop: "{{ ['ipsec_policy_based', 'firewall', 'nat'] if inventory_hostname == 'left' else ['ipsec_policy_based'] }}"

- name: Verify the page's requirements with traffic
  hosts: localhost
  gather_facts: false
  vars:
    _flows:
      - {
          from: l11,
          to: 10.2.21.10,
          why: "LAN to LAN through the tunnel, without NAT",
        }
      - { from: l12, to: 10.2.22.10, why: "second LAN pair through the tunnel" }
      - {
          from: r21,
          to: 10.1.11.10,
          why: "remote LANs may connect to local LANs",
        }
      - {
          from: l11,
          to: 203.0.113.10,
          why: "local subnets reach the internet using source NAT",
        }
      - {
          from: internet,
          to: 198.51.100.14,
          why: "ICMP is allowed on all interfaces",
        }
  tasks:
    - name: Ping per requirement
      ansible.builtin.command:
        cmd: docker exec clab-bp-pif-{{ item.from }} ping -c 3 -W 2 {{ item.to }}
      become: "{{ lookup('ansible.builtin.env', 'CLAB_BECOME', default='true') | bool }}"
      changed_when: false
      loop: "{{ _flows }}"
      loop_control:
        label: "{{ item.from }} -> {{ item.to }} ({{ item.why }})"
