---
# VyOS3 and VyOS2 from docs.vyos.io/en/1.5/configexamples/qos.html, interfaces
# shifted by one; VyOS4 and its link (10.2.1.0/24) are left out of the lab.
all:
  children:
    vyos:
      hosts:
        vyos3:
          ansible_host: clab-bp-qos-vyos3
          base_hostname: vyos3
          base_interfaces:
            - name: eth1
              addresses: [10.1.1.100/24]
            - name: eth2
              addresses: [172.17.1.1/24]
          base_static_routes:
            - {dest: 0.0.0.0/0, next_hop: 10.1.1.1}
          qos_shapers:
            - name: vyos3
              classes:
                - id: 10
                  set_dscp: CS4
                  matches:
                    - name: ADDRESS10
                      ip:
                        source: {address: 172.17.1.2/32}
                - id: 20
                  set_dscp: CS5
                  matches:
                    - name: ADDRESS20
                      ip:
                        source: {address: 172.17.1.3/32}
                - id: 30
                  set_dscp: CS6
                  matches:
                    - name: ADDRESS30
                      ip:
                        source: {address: 172.17.1.4/32}
              default: {bandwidth: 10%, ceiling: 100%, priority: 7, queue_type: fair-queue}
          qos_interfaces:
            - {name: eth1, egress: vyos3}
        vyos2:
          ansible_host: clab-bp-qos-vyos2
          base_hostname: vyos2
          base_interfaces:
            - name: eth1
              addresses: [10.1.1.1/24]
            - name: eth3
              addresses: [10.9.9.1/24]
          base_static_routes:
            - {dest: 172.17.1.0/24, next_hop: 10.1.1.100}
          qos_shapers:
            - name: vyos2
              classes:
                - id: 10
                  bandwidth: 100%
                  burst: 15k
                  queue_type: fair-queue
                  set_dscp: CS5
                  matches:
                    - name: VYOS2
                      ip: {dscp: CS4}
                - id: 20
                  bandwidth: 5mbit
                  description: for VyOS3 eth0
                  matches:
                    - name: VyOS3
                      ip:
                        source: {address: 10.1.1.100/32}
              default: {bandwidth: 100%, burst: 15k, ceiling: 100%, priority: 7, queue_type: fair-queue}
          qos_interfaces:
            - {name: eth3, egress: vyos2}
      vars: {ansible_network_os: vyos.vyos.vyos, ansible_connection: ansible.netcommon.network_cli, ansible_user: admin, ansible_password: admin}
