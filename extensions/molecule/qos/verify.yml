---
- name: Verify role state
  hosts: vyos
  gather_facts: false
  tasks:
    - name: Run role checks
      ansible.builtin.include_role:
        name: vyos.blueprints.qos
        tasks_from: verify

- name: Verify DSCP marking end to end, as in the page's captures
  hosts: localhost
  gather_facts: false
  vars:
    _become: "{{ lookup('ansible.builtin.env', 'CLAB_BECOME', default='true') | bool }}"
    _flows:
      - {src: 172.17.1.2, tos: "0xa0", why: "CS4 at vyos3, re-marked CS4 -> CS5 at vyos2"}
      - {src: 172.17.1.3, tos: "0xa0", why: "CS5 at vyos3"}
      - {src: 172.17.1.4, tos: "0xc0", why: "CS6 at vyos3"}
      - {src: 172.17.1.40, tos: "0x0", why: "CS0 by default"}
  tasks:
    - name: Capture on the sink while pinging from each source
      # tcpdump in the foreground, line-buffered, all ICMP: the output shows
      # everything the sink received, also when the check fails.
      ansible.builtin.shell:
        cmd: >-
          ( sleep 2; docker exec clab-bp-qos-vpcs ping -c 3 -W 2 -I {{ item.src }} 10.9.9.10 > /dev/null 2>&1 ) &
          docker exec clab-bp-qos-sink timeout 8 tcpdump -l -n -v -i eth1 icmp 2>&1; wait
      become: "{{ _become }}"
      register: _cap
      changed_when: false
      # the echo request from this source, with the expected TOS byte; tcpdump -v prints
      # the IP header (tos) and the addresses on two lines, so each line is joined with the next
      failed_when: >-
        _cap.stdout_lines | zip(_cap.stdout_lines[1:])
        | selectattr('0', 'search', 'tos ' ~ item.tos ~ ',') | selectattr('1', 'search', item.src ~ ' > 10[.]9[.]9[.]10')
        | list | length == 0
      loop: "{{ _flows }}"
      loop_control:
        label: "{{ item.src }} -> tos {{ item.tos }} ({{ item.why }})"
