---
- name: Verify role state
  hosts: vyos
  gather_facts: false
  tasks:
    - name: Run role checks
      ansible.builtin.include_role:
        name: vyos.blueprints.qos
        tasks_from: verify

- name: Verify DSCP marking end to end, as in the page's captures
  hosts: localhost
  gather_facts: false
  vars:
    _become: "{{ lookup('ansible.builtin.env', 'CLAB_BECOME', default='true') | bool }}"
    _flows:
      - {
          src: 172.17.1.2,
          tos: "0xa0",
          why: "CS4 at vyos3, re-marked CS4 -> CS5 at vyos2",
        }
      - { src: 172.17.1.3, tos: "0xa0", why: "CS5 at vyos3" }
      - { src: 172.17.1.4, tos: "0xc0", why: "CS6 at vyos3" }
      - { src: 172.17.1.40, tos: "0x0", why: "CS0 by default" }
  tasks:
    - name: Capture on the sink while pinging from each source
      ansible.builtin.shell:
        cmd: >-
          docker exec -d clab-bp-qos-sink sh -c
          'timeout 15 tcpdump -n -v -c 2 -i eth1 icmp and src {{ item.src }} > /tmp/cap-{{ item.src }} 2>&1';
          sleep 2;
          docker exec clab-bp-qos-vpcs ping -c 3 -W 2 -I {{ item.src }} 10.9.9.10 > /dev/null;
          sleep 2;
          docker exec clab-bp-qos-sink cat /tmp/cap-{{ item.src }}
      become: "{{ _become }}"
      register: _cap
      changed_when: false
      failed_when: _cap.stdout is not search('tos ' ~ item.tos ~ '\b')
      loop: "{{ _flows }}"
      loop_control:
        label: "{{ item.src }} -> tos {{ item.tos }} ({{ item.why }})"
