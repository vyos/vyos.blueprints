---
- name: Verify the core router
  hosts: cores
  gather_facts: false
  tasks:
    - name: Wait for BGP and route leaking
      ansible.builtin.pause:
        seconds: 30

    - name: Run role checks
      ansible.builtin.include_role:
        name: vyos.blueprints.vrf_lite
        tasks_from: verify

- name: End-to-end verification, as in the page's step 4
  hosts: localhost
  gather_facts: false
  vars:
    _flows:
      - {
          from: mgmt,
          src: 192.168.0.1,
          to: 10.0.0.1,
          allowed: true,
          why: "Management reaches LAN1",
        }
      - {
          from: mgmt,
          src: 192.168.0.1,
          to: 172.16.0.1,
          allowed: true,
          why: "Management reaches LAN2",
        }
      - {
          from: mgmt,
          src: 192.168.0.1,
          to: 192.0.2.1,
          allowed: false,
          why: "Management has no access to the outside",
        }
      - {
          from: lan1,
          src: 10.0.0.1,
          to: 192.0.2.1,
          allowed: true,
          why: "LAN1 reaches the Internet",
        }
      - {
          from: lan1,
          src: 10.0.0.1,
          to: 172.16.0.1,
          allowed: true,
          why: "LAN1 reaches LAN2",
        }
      - {
          from: lan1,
          src: "2001:db8:0:1::1",
          to: "2001:db8:1::1",
          allowed: true,
          why: "LAN1 reaches the Internet over IPv6",
        }
  tasks:
    - name: Ping with a source address, as on the page
      ansible.builtin.command:
        cmd: docker exec clab-bp-ivrf-{{ item.from }} ping -c 2 -W 2 -I {{ item.src }} {{ item.to }}
      become: "{{ lookup('ansible.builtin.env', 'CLAB_BECOME', default='true') | bool }}"
      register: _ping
      changed_when: false
      failed_when: (_ping.rc == 0) != item.allowed
      loop: "{{ _flows }}"
      loop_control:
        label: "{{ item.from }} -> {{ item.to }} ({{ item.why }})"
