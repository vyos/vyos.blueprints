---
all:
  children:
    vyos:
      hosts:
        r1:
          ansible_host: clab-bp-mgmt-r1
      vars:
        ansible_network_os: vyos.vyos.vyos
        ansible_connection: ansible.netcommon.network_cli
        ansible_user: admin
        ansible_password: admin
        base_interfaces:
          - name: eth1
            addresses: [192.0.2.1/24]
        management_snmp:
          contact: molecule@example.net
          location: containerlab
          communities:
            - name: molecule-ro
              clients: [192.0.2.50]
          trap_targets:
            - address: 192.0.2.50
              community: molecule-traps
        management_syslog_hosts:
          - host: 192.0.2.50
        management_ntp_servers: [192.0.2.50]
        # RADIUS login is configured but never used for the Molecule SSH session
        # (local admin user stays first), so an unreachable server is harmless.
        management_radius:
          servers:
            - address: 192.0.2.50
              key: molecule-radius
              timeout: 2
