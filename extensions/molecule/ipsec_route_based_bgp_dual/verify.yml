---
- name: Verify both tunnels and BGP sessions
  hosts: vpn
  gather_facts: false
  tasks:
    - name: Wait for IKE, IPsec and BGP
      ansible.builtin.pause:
        seconds: 60
      run_once: true

    - name: Run role checks
      ansible.builtin.include_role:
        name: vyos.blueprints.ipsec_route_based
        tasks_from: verify

- name: Verify redundancy - traffic survives losing the primary tunnel
  hosts: r1
  gather_facts: false
  vars:
    _ping: docker exec clab-bp-azure2-onprem ping -c 3 -W 2 10.0.1.10
    _become: "{{ lookup('ansible.builtin.env', 'CLAB_BECOME', default='true') | bool }}"
  tasks:
    - name: Ping the VNet with both tunnels up
      ansible.builtin.command: "{{ _ping }}"
      delegate_to: localhost
      become: "{{ _become }}"
      changed_when: false

    - name: Take the primary tunnel down
      vyos.vyos.vyos_config:
        lines:
          - set vpn ipsec site-to-site peer azure-primary disable

    - name: Route the VNet via the secondary gateway, as Azure's platform routing would
      # The VNet host is plain Linux: its multipath route cannot notice that azure1 lost
      # its tunnel. In Azure the VNet's routing follows the gateway instance with the tunnel.
      ansible.builtin.command:
        argv: [docker, exec, clab-bp-azure2-vm, ip, route, replace, 10.10.0.0/16, via, 10.0.1.2]
      delegate_to: localhost
      become: "{{ _become }}"
      changed_when: false

    - name: Wait for BGP to converge on the secondary path
      ansible.builtin.pause:
        seconds: 40

    - name: Ping the VNet over the secondary tunnel only
      ansible.builtin.command: "{{ _ping }}"
      delegate_to: localhost
      become: "{{ _become }}"
      changed_when: false

    - name: Bring the primary tunnel back
      vyos.vyos.vyos_config:
        lines:
          - delete vpn ipsec site-to-site peer azure-primary disable

    - name: Restore the VNet's route over both gateways
      ansible.builtin.command:
        argv: [docker, exec, clab-bp-azure2-vm, ip, route, replace, 10.10.0.0/16,
               nexthop, via, 10.0.1.1, nexthop, via, 10.0.1.2]
      delegate_to: localhost
      become: "{{ _become }}"
      changed_when: false
