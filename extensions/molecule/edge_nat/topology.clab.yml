name: bp-edge-nat
topology:
  nodes:
    r1:
      kind: vyosnetworks_vyos
      image: ${VYOS_IMAGE:=vyos:blueprints-ci}
    isp:
      kind: linux
      image: alpine:3
      exec:
        - ip addr add 203.0.113.1/24 dev eth1
    lan:
      kind: linux
      image: alpine:3
      exec:
        - ip addr add 192.168.10.10/24 dev eth1
        - ip route replace default via 192.168.10.1
  links:
    - endpoints: ["r1:eth1", "isp:eth1"]
    - endpoints: ["r1:eth2", "lan:eth1"]
