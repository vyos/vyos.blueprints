---
# Hubs before spokes: a spoke that starts IKE towards a hub that is not configured yet
# gets NO_PROPOSAL_CHOSEN and does not retry, and without IPsec there is no NHRP
# registration and no OSPF over that tunnel.
- name: Converge the hubs first
  hosts: dmvpn:&hub*
  gather_facts: false
  roles:
    - vyos.blueprints.base
    - vyos.blueprints.gre_tunnel
    - vyos.blueprints.dmvpn
    - vyos.blueprints.ospf

- name: Converge the spokes
  hosts: dmvpn:!hub*
  gather_facts: false
  roles:
    - vyos.blueprints.base
    - vyos.blueprints.gre_tunnel
    - vyos.blueprints.dmvpn
    - vyos.blueprints.ospf
