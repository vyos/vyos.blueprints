---
- name: Verify IS-IS and segment routing
  hosts: p_routers
  gather_facts: false
  tasks:
    - name: Wait for IS-IS adjacencies and SR labels
      ansible.builtin.pause:
        seconds: 30
      run_once: true

    - name: Run role checks
      ansible.builtin.include_role:
        name: vyos.blueprints.isis
        tasks_from: verify

- name: Verify label switching between P1 and P2, as on the page
  hosts: P1-VyOS
  gather_facts: false
  tasks:
    - name: Read P1's IS-IS routes
      vyos.vyos.vyos_command:
        commands: [show ip route isis]
      register: _routes

    - name: P2's loopback is reached with prefix-SID label 16002
      ansible.builtin.assert:
        that: _routes.stdout[0] is search('192\.0\.2\.2/32 .*label 16002')
        quiet: true

    - name: Ping P2's loopback from P1's loopback
      vyos.vyos.vyos_ping:
        dest: 192.0.2.2
        source: 192.0.2.1
        count: 3
