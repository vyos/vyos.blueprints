name: bp-isis
topology:
  kinds:
    vyosnetworks_vyos:
      image: ${VYOS_IMAGE:=vyos:blueprints-ci}
  nodes:
    p1:
      kind: vyosnetworks_vyos
    p2:
      kind: vyosnetworks_vyos
    # VyOS standing in for the page's Cisco XRv-P3
    p3:
      kind: vyosnetworks_vyos
  links:
    - endpoints: ["p1:eth1", "p3:eth1"]   # 192.0.2.4/30
    - endpoints: ["p3:eth2", "p2:eth2"]   # 192.0.2.16/30
