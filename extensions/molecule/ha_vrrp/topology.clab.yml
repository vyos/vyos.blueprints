name: bp-ha
topology:
  kinds:
    vyosnetworks_vyos:
      image: ${VYOS_IMAGE:=vyos:blueprints-ci}
  nodes:
    r1:
      kind: vyosnetworks_vyos
    r2:
      kind: vyosnetworks_vyos
  links:
    # Both VRRP VLANs ride one point-to-point trunk between the routers.
    - endpoints: ["r1:eth1", "r2:eth1"]
