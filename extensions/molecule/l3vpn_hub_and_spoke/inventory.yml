---
# docs.vyos.io/en/1.5/configexamples/l3vpn-hub-and-spoke.html on a reduced core
# (RR1 and one P router; RR2 and P2-P4 left out). PE and CE values are the
# page's; core links are lab addresses; CE uplinks are eth1 (eth0 is management).
all:
  children:
    vyos:
      hosts:
        p1:
          base_interfaces:
            - name: dum10
              addresses:
                - 10.0.0.3/32
            - name: eth1
              addresses:
                - 172.16.91.1/24
            - name: eth2
              addresses:
                - 172.16.92.1/24
            - name: eth3
              addresses:
                - 172.16.93.1/24
            - name: eth4
              addresses:
                - 172.16.94.1/24
          ospf_router_id: 10.0.0.3
          ospf_areas:
            - id: '0'
              networks:
                - 0.0.0.0/0
          ospf_abr_type: cisco
          mpls_ldp_router_id: 10.0.0.3
          mpls_ldp_interfaces:
            - eth1
            - eth2
            - eth3
            - eth4
          ansible_host: clab-bp-l3vpn-p1
        rr1:
          base_interfaces:
            - name: dum10
              addresses:
                - 10.0.0.1/32
            - name: eth1
              addresses:
                - 172.16.94.2/24
          ospf_router_id: 10.0.0.1
          ospf_areas:
            - id: '0'
              networks:
                - 0.0.0.0/0
          ospf_abr_type: cisco
          mpls_ldp_router_id: 10.0.0.1
          mpls_ldp_interfaces:
            - eth1
          l3vpn_asn: 65001
          l3vpn_router_id: 10.0.0.1
          l3vpn_cluster_id: 10.0.0.1
          l3vpn_peer_group: &id001
            name: RR_VPNv4
            remote_as: 65001
            update_source: dum10
          l3vpn_neighbors:
            - address: 10.0.0.7
              route_reflector_client: true
            - address: 10.0.0.8
              route_reflector_client: true
            - address: 10.0.0.10
              route_reflector_client: true
          ansible_host: clab-bp-l3vpn-rr1
        pe1:
          base_interfaces:
            - name: dum10
              addresses:
                - 10.0.0.7/32
            - name: eth1
              addresses:
                - 172.16.91.2/24
            - name: eth2
              addresses:
                - 10.50.50.1/24
          ospf_router_id: 10.0.0.7
          ospf_areas:
            - id: '0'
              networks:
                - 0.0.0.0/0
          ospf_abr_type: cisco
          mpls_ldp_router_id: 10.0.0.7
          mpls_ldp_interfaces:
            - eth1
          l3vpn_asn: 65001
          l3vpn_router_id: 10.0.0.7
          l3vpn_peer_group: *id001
          l3vpn_neighbors:
            - address: 10.0.0.1
              nexthop_self: true
          vrf_lite_asn: 65001
          vrf_lite_vrfs:
            - name: BLUE_SPOKE
              table: 200
              interfaces:
                - eth2
              families:
                - ipv4
              label_vpn_export: auto
              networks:
                - 10.50.50.0/24
              rd: 10.50.50.1:1011
              route_targets_export:
                - 65035:1011
              route_targets_import:
                - 65035:1030
              redistribute:
                - connected
              neighbors:
                - address: 10.50.50.2
                  remote_as: 65035
                  as_override: true
          ansible_host: clab-bp-l3vpn-pe1
        pe2:
          base_interfaces:
            - name: dum10
              addresses:
                - 10.0.0.8/32
            - name: eth1
              addresses:
                - 172.16.92.2/24
            - name: eth2
              addresses:
                - 10.80.80.1/24
          ospf_router_id: 10.0.0.8
          ospf_areas:
            - id: '0'
              networks:
                - 0.0.0.0/0
          ospf_abr_type: cisco
          mpls_ldp_router_id: 10.0.0.8
          mpls_ldp_interfaces:
            - eth1
          l3vpn_asn: 65001
          l3vpn_router_id: 10.0.0.8
          l3vpn_peer_group: *id001
          l3vpn_neighbors:
            - address: 10.0.0.1
              nexthop_self: true
          vrf_lite_asn: 65001
          vrf_lite_vrfs:
            - name: BLUE_HUB
              table: 400
              interfaces:
                - eth2
              families:
                - ipv4
              label_vpn_export: auto
              networks:
                - 10.80.80.0/24
              rd: 10.80.80.1:1011
              route_targets_export:
                - 65035:1030
              route_targets_import:
                - 65035:1011
                - 65050:2011
                - 65035:1030
              redistribute:
                - connected
              neighbors:
                - address: 10.80.80.2
                  remote_as: 65035
                  as_override: true
          ansible_host: clab-bp-l3vpn-pe2
        pe3:
          base_interfaces:
            - name: dum10
              addresses:
                - 10.0.0.10/32
            - name: eth1
              addresses:
                - 172.16.93.2/24
            - name: eth2
              addresses:
                - 10.60.60.1/24
          ospf_router_id: 10.0.0.10
          ospf_areas:
            - id: '0'
              networks:
                - 0.0.0.0/0
          ospf_abr_type: cisco
          mpls_ldp_router_id: 10.0.0.10
          mpls_ldp_interfaces:
            - eth1
          l3vpn_asn: 65001
          l3vpn_router_id: 10.0.0.10
          l3vpn_peer_group: *id001
          l3vpn_neighbors:
            - address: 10.0.0.1
              nexthop_self: true
          vrf_lite_asn: 65001
          vrf_lite_vrfs:
            - name: BLUE_SPOKE
              table: 200
              interfaces:
                - eth2
              families:
                - ipv4
              label_vpn_export: auto
              networks:
                - 10.60.60.0/24
              rd: 10.60.60.1:1011
              route_targets_export:
                - 65035:1011
              route_targets_import:
                - 65035:1030
              redistribute:
                - connected
              neighbors:
                - address: 10.60.60.2
                  remote_as: 65035
                  as_override: true
          ansible_host: clab-bp-l3vpn-pe3
        ce1:
          base_interfaces:
            - name: dum20
              addresses:
                - 10.0.0.80/32
            - name: eth1
              addresses:
                - 10.50.50.2/24
          bgp_asn: 65035
          bgp_router_id: 10.50.50.2
          bgp_networks:
            - 10.0.0.80/32
          bgp_log_neighbor_changes: true
          bgp_neighbors:
            - address: 10.50.50.1
              remote_as: 65001
              ebgp_multihop: 2
              update_source: eth1
          ansible_host: clab-bp-l3vpn-ce1
        cehub:
          base_interfaces:
            - name: dum20
              addresses:
                - 10.0.0.100/32
            - name: eth1
              addresses:
                - 10.80.80.2/24
          bgp_asn: 65035
          bgp_router_id: 10.80.80.2
          bgp_networks:
            - 10.0.0.100/32
          bgp_log_neighbor_changes: true
          bgp_neighbors:
            - address: 10.80.80.1
              remote_as: 65001
              ebgp_multihop: 2
              update_source: eth1
          bgp_redistribute:
            - type: connected
          ansible_host: clab-bp-l3vpn-cehub
        ce2:
          base_interfaces:
            - name: dum20
              addresses:
                - 10.0.0.90/32
            - name: eth1
              addresses:
                - 10.60.60.2/24
          bgp_asn: 65035
          bgp_router_id: 10.60.60.2
          bgp_networks:
            - 10.0.0.90/32
          bgp_log_neighbor_changes: true
          bgp_neighbors:
            - address: 10.60.60.1
              remote_as: 65001
              ebgp_multihop: 2
              update_source: eth1
          ansible_host: clab-bp-l3vpn-ce2
      vars:
        ansible_network_os: vyos.vyos.vyos
        ansible_connection: ansible.netcommon.network_cli
        ansible_user: admin
        ansible_password: admin
