---
- name: Verify the provider network
  hosts: vyos
  gather_facts: false
  tasks:
    - name: Wait for OSPF, LDP and BGP
      ansible.builtin.pause:
        seconds: 60
      run_once: true

    - name: Run role checks
      ansible.builtin.include_role:
        name: "vyos.blueprints.{{ item }}"
        tasks_from: verify
      loop: "{{ ['mpls_ldp', 'l3vpn'] if inventory_hostname in ['p1', 'rr1', 'pe1', 'pe2', 'pe3'] else ['bgp'] }}"

- name: Verify hub-and-spoke reachability, as in the page's step 5
  hosts: ce1:ce2:cehub
  gather_facts: false
  vars:
    _flows:
      ce1: [{dest: 10.0.0.100, source: 10.0.0.80}]
      ce2: [{dest: 10.0.0.100, source: 10.0.0.90}]
      cehub: [{dest: 10.0.0.80, source: 10.0.0.100}, {dest: 10.0.0.90, source: 10.0.0.100}]
  tasks:
    - name: Ping between CE loopbacks through the L3VPN
      vyos.vyos.vyos_ping:
        dest: "{{ item.dest }}"
        source: "{{ item.source }}"
        count: 3
      loop: "{{ _flows[inventory_hostname] }}"
      loop_control:
        label: "{{ item.source }} -> {{ item.dest }}"

- name: Verify spokes are isolated from each other
  hosts: ce1
  gather_facts: false
  tasks:
    - name: Read CE1's routing table
      vyos.vyos.vyos_command:
        commands: [show ip route]
      register: _rib

    - name: CE1 learns the hub but not the other spoke
      ansible.builtin.assert:
        that:
          - _rib.stdout[0] is search('10\.0\.0\.100/32')
          - _rib.stdout[0] is not search('10\.0\.0\.90/32')
        quiet: true
