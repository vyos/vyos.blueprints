name: bp-hawalk
topology:
  kinds:
    vyosnetworks_vyos:
      image: ${VYOS_IMAGE:=vyos:blueprints-ci}
  nodes:
    router1:
      kind: vyosnetworks_vyos
    router2:
      kind: vyosnetworks_vyos
    # "switch pair": VLAN-aware bridge, router2's ports bonded with LACP as on the page.
    # LACP needs the kernel bonding module on the container host.
    sw:
      kind: linux
      image: alpine:3
      exec:
        - ip link add br0 type bridge vlan_filtering 1
        - ip link add bond0 type bond mode 802.3ad
        - ip link set eth2 down
        - ip link set eth3 down
        - ip link set eth2 master bond0
        - ip link set eth3 master bond0
        - ip link set bond0 up
        - ip link set eth1 master br0
        - ip link set bond0 master br0
        - ip link set eth4 master br0
        - ip link set eth5 master br0
        - bridge vlan add dev eth1 vid 50
        - bridge vlan add dev eth1 vid 100
        - bridge vlan add dev eth1 vid 201
        - bridge vlan add dev bond0 vid 50
        - bridge vlan add dev bond0 vid 100
        - bridge vlan add dev bond0 vid 201
        - bridge vlan add dev eth4 vid 50 pvid untagged
        - bridge vlan add dev eth5 vid 201 pvid untagged
        - ip link set br0 up
    # upstream router (VLAN 50); 198.51.100.100 stands for "the internet"
    upstream:
      kind: linux
      image: alpine:3
      exec:
        - ip addr add 192.0.2.11/24 dev eth1
        - ip addr add 198.51.100.100/32 dev lo
        - ip route add 203.0.113.0/24 via 192.0.2.21
    internal:
      kind: linux
      image: alpine:3
      exec:
        [
          "ip addr add 10.200.201.10/24 dev eth1",
          "ip route replace default via 10.200.201.1",
        ]
  links:
    - endpoints: ["router1:eth1", "sw:eth1"]
    - endpoints: ["router2:eth1", "sw:eth2"]
    - endpoints: ["router2:eth2", "sw:eth3"]
    - endpoints: ["sw:eth4", "upstream:eth1"]
    - endpoints: ["sw:eth5", "internal:eth1"]
