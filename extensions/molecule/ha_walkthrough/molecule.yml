---
# VyOS runs as a container (containerlab kind vyosnetworks_vyos);
# the lab is deployed in prepare and destroyed in cleanup.
dependency:
  name: galaxy
  enabled: false
driver:
  name: default
  options:
    managed: false
platforms:
  - name: router1
  - name: router2
provisioner:
  name: ansible
  config_options:
    defaults:
      host_key_checking: false
    persistent_connection:
      command_timeout: 60
      # paramiko tries every address a name resolves to; libssh only the first.
      # containerlab's management network is dual-stack, but VyOS's sshd (as
      # configured by containerlab) listens on IPv4 only.
      ssh_type: paramiko
  inventory:
    links:
      hosts: inventory.yml
  playbooks:
    prepare: ../_shared/lab_up.yml
    cleanup: ../_shared/lab_down.yml
verifier:
  name: ansible
