---
- name: Verify
  hosts: fabric
  gather_facts: false
  tasks:
    - name: Wait for OSPF adjacencies and routes
      ansible.builtin.pause:
        seconds: 45
      run_once: true

    - name: Run role checks
      ansible.builtin.include_role:
        name: vyos.blueprints.ospf_unnumbered
        tasks_from: verify

    - name: Read the route to the other router's LAN
      vyos.vyos.vyos_command:
        commands:
          - "show ip route {{ '10.2.0.0/24' if inventory_hostname == 'r1' else '10.1.0.0/24' }}"
      register: _lan_route

    - name: The other LAN is learned via OSPF (redistribute connected) over both links
      ansible.builtin.assert:
        that:
          - _lan_route.stdout[0] is search('Known via "ospf"')
          - _lan_route.stdout[0] | regex_findall('via \S+ onlink') | length == 2
        quiet: true
